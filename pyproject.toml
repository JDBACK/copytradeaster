[project]
name = "copytradeaster"
version = "0.1.0"
description = "AsterDex V3 copy-trade bot: core engine and Telegram runtime (testnet)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram==3.30.0",
    "httpx>=0.27,<1",
    "websockets>=13,<16",
    "eth-account>=0.13,<0.14",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "aiosqlite>=0.20,<0.22",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "respx>=0.21,<0.23",
]

[project.scripts]
copytradeaster = "copytradeaster.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "testnet: signed runs against fapi.asterdex-testnet.com",
    "load: explicit hybrid/shadow load campaigns",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/copytradeaster"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/history/**", "docs/reviews/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
